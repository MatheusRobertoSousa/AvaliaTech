services:
  postgres:
    image: postgres:16-alpine
    container_name: avaliatech-postgres
    environment:
      POSTGRES_DB: avaliatech
      POSTGRES_USER: avaliatech
      POSTGRES_PASSWORD: avaliatech
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avaliatech -d avaliatech"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
