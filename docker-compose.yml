services:
  postgres:
    image: postgres:16-alpine
    container_name: avaliatech-postgres
    environment:
      POSTGRES_DB: avaliatech
      POSTGRES_USER: avaliatech
      POSTGRES_PASSWORD: avaliatech
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
